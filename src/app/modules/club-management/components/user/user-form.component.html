<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <button class="back-btn" (click)="goBack()">← Retour</button>
      <h2>{{ isEditMode ? '✏️ Modifier l\'Utilisateur' : '➕ Nouvel Utilisateur' }}</h2>
    </div>

    <div *ngIf="loading" class="loading-container"><div class="spinner"></div></div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <div class="form-grid">
        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" formControlName="firstName" placeholder="Prénom" class="form-control">
          <div class="error-message" *ngIf="getFieldError('firstName')">{{ getFieldError('firstName') }}</div>
        </div>

        <div class="form-group">
          <label>Nom *</label>
          <input type="text" formControlName="lastName" placeholder="Nom" class="form-control">
          <div class="error-message" *ngIf="getFieldError('lastName')">{{ getFieldError('lastName') }}</div>
        </div>

        <div class="form-group full-width">
          <label>Email *</label>
          <input type="email" formControlName="email" placeholder="email@exemple.com" class="form-control">
          <div class="error-message" *ngIf="getFieldError('email')">{{ getFieldError('email') }}</div>
        </div>

        <div class="form-group">
          <label>Téléphone *</label>
          <input type="tel" formControlName="phone" placeholder="12345678" class="form-control">
          <div class="error-message" *ngIf="getFieldError('phone')">{{ getFieldError('phone') }}</div>
        </div>

        <div class="form-group">
          <label>Mot de passe *</label>
          <input type="password" formControlName="passwordHash" placeholder="Mot de passe" class="form-control">
          <div class="error-message" *ngIf="getFieldError('passwordHash')">{{ getFieldError('passwordHash') }}</div>
        </div>

        <div class="form-group">
          <label>Confirmer mot de passe *</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirmer" class="form-control">
          <div class="error-message" *ngIf="getFieldError('confirmPassword')">{{ getFieldError('confirmPassword') }}</div>
        </div>

        <div class="form-group">
          <label>Département</label>
          <input type="text" formControlName="department" placeholder="Département" class="form-control">
        </div>

        <div class="form-group">
          <label>Rôle *</label>
          <select formControlName="role" class="form-control">
            <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
          </select>
          <div class="error-message" *ngIf="getFieldError('role')">{{ getFieldError('role') }}</div>
        </div>

        <div class="form-group">
          <label>Statut</label>
          <select formControlName="isActive" class="form-control">
            <option [value]="true">✅ Actif</option>
            <option [value]="false">❌ Inactif</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Club</label>
          <select formControlName="clubId" class="form-control">
            <option [value]="null">Aucun club</option>
            <option *ngFor="let club of clubs" [value]="club.idClub">{{ club.nom }}</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="goBack()">Annuler</button>
        <button type="submit" class="btn-submit" [disabled]="submitting">
          {{ submitting ? 'Enregistrement...' : (isEditMode ? 'Modifier' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>
