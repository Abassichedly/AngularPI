<aside class="sidebar">
  <div class="sidebar-nav">

    <div *ngFor="let item of navItems">

      <!-- MAIN ITEM -->
      <div class="nav-link main-item" (click)="toggleMenu(item)">
        <span>{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        <span class="arrow">{{ item.expanded ? '▼' : '▶' }}</span>
      </div>

      <!-- SUB ITEMS -->
      <div *ngIf="item.expanded" class="sub-menu">
        <a *ngFor="let child of item.children"
           [routerLink]="child.path"
           [class.active]="isActive(child.path)"
           class="nav-link sub-item">

          <span>{{ child.icon }}</span>
          <span>{{ child.label }}</span>
        </a>
      </div>

    </div>

  </div>
</aside>
