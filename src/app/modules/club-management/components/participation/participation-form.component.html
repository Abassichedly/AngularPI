<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">➕ Nouvelle Participation</h1>
      <p class="page-subtitle">Ajouter une participation à une activité ou un événement</p>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="participationForm" (ngSubmit)="onSubmit()">
      
      <!-- User Selection -->
      <div class="form-group">
        <label>Utilisateur *</label>
        <select formControlName="userId" class="form-control">
          <option value="">Sélectionner un utilisateur</option>
          <option *ngFor="let user of users" [value]="user.id">
            {{ user.firstName }} {{ user.lastName }} - {{ user.email }}
          </option>
        </select>
        <div class="error" *ngIf="participationForm.get('userId')?.invalid && participationForm.get('userId')?.touched">
          L'utilisateur est requis
        </div>
      </div>

      <!-- Type Selection -->
      <div class="form-group">
        <label>Type de participation *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" formControlName="type" value="activity">
            <span>🎯 Activité</span>
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="type" value="event">
            <span>📅 Événement</span>
          </label>
        </div>
      </div>

      <!-- Activity Selection -->
      <div class="form-group" *ngIf="selectedType === 'activity'">
        <label>Activité *</label>
        <select formControlName="activiteId" class="form-control">
          <option value="">Sélectionner une activité</option>
          <option *ngFor="let activity of activities" [value]="activity.idActivite">
            {{ getActivityTitle(activity) }}
          </option>
        </select>
        <div class="error" *ngIf="participationForm.get('activiteId')?.invalid && participationForm.get('activiteId')?.touched">
          L'activité est requise
        </div>
      </div>

      <!-- Event Selection -->
      <div class="form-group" *ngIf="selectedType === 'event'">
        <label>Événement *</label>
        <select formControlName="eventId" class="form-control">
          <option value="">Sélectionner un événement</option>
          <option *ngFor="let event of events" [value]="event.idEvent">
            {{ getEventName(event) }}
          </option>
        </select>
        <div class="error" *ngIf="participationForm.get('eventId')?.invalid && participationForm.get('eventId')?.touched">
          L'événement est requis
        </div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label>Statut</label>
        <select formControlName="statutPresence" class="form-control">
          <option *ngFor="let statut of statutsPresence" [value]="statut.value">
            {{ statut.label }}
          </option>
        </select>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label>Rôle</label>
        <select formControlName="role" class="form-control">
          <option *ngFor="let role of roles" [value]="role.value">
            {{ role.label }}
          </option>
        </select>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="goBack()">
          Annuler
        </button>
        <button type="submit" class="btn-primary" [disabled]="submitting">
          {{ submitting ? 'Ajout en cours...' : 'Ajouter la participation' }}
        </button>
      </div>
    </form>
  </div>
</div>
